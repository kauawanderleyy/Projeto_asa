---
- name: Configuração do Servidor NFS (Arq)
  hosts: arq
  become: yes
  tasks:
    - name: Instalar o servidor NFS
      apt:
        name: nfs-kernel-server
        state: present

    - name: Criar o usuário nfs-ifpb sem shell de login
      user:
        name: nfs-ifpb
        uid: 2000
        shell: /bin/false

    - name: Garantir que o diretório /dados/nfs existe conforme o escopo
      file:
        path: /dados/nfs
        state: directory
        owner: nfs-ifpb
        group: nfs-ifpb
        mode: '0755'

    - name: Configurar as exportações com mapeamento de usuário (all_squash e sync)
      copy:
        dest: /etc/exports
        content: "/dados/nfs 192.168.56.0/24(rw,sync,no_subtree_check,insecure,all_squash,anonuid=2000,anongid=2000)\n"

    - name: Aplicar as exportações
      command: exportfs -ra

    - name: Garantir que o serviço NFS está rodando
      service:
        name: nfs-kernel-server
        state: restarted
        enabled: yes

- name: Configuração do Autofs nos Clientes
  hosts: banco_dados, aplicacao, clientes
  become: yes
  tasks:
    - name: Instalar pacotes de cliente NFS e Autofs
      apt:
        name:
          - nfs-common
          - autofs
        state: present

    - name: Configurar o arquivo auto.master do Autofs
      lineinfile:
        path: /etc/auto.master
        line: "/var /etc/auto.nfs --timeout=60"

    - name: Configurar o mapa de montagem para /var/nfs
      copy:
        dest: /etc/auto.nfs
        content: "nfs -fstype=nfs,rw,sync 192.168.56.112:/dados/nfs\n"

    - name: Reiniciar e ativar o serviço Autofs
      service:
        name: autofs
        state: restarted
        enabled: yes
